<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360" role="img" aria-label="Ilustración del sistema LIMS-BioPuna">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef8f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0a3a25" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- soft glow -->
  <circle cx="210" cy="170" r="150" fill="url(#bg)"/>
  <circle cx="300" cy="95" r="34" fill="#f2b53f" fill-opacity="0.22"/>
  <circle cx="108" cy="250" r="28" fill="#6fd9a2" fill-opacity="0.18"/>

  <!-- main screen -->
  <g filter="url(#shadow)">
    <rect x="72" y="52" rx="22" ry="22" width="276" height="196" fill="url(#screen)" stroke="#f2b53f" stroke-width="4"/>
    <rect x="72" y="52" rx="22" ry="22" width="276" height="44" fill="#17784e"/>
    <circle cx="98" cy="74" r="6" fill="#ffd477"/>
    <circle cx="120" cy="74" r="6" fill="#6fd9a2"/>
    <circle cx="142" cy="74" r="6" fill="#ecfbf3" fill-opacity="0.8"/>
    <rect x="210" y="64" rx="10" ry="10" width="116" height="20" fill="#0f5a39"/>
    <text x="268" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffd477">CAMPANA ACTIVA</text>
  </g>

  <!-- chart area -->
  <rect x="96" y="118" rx="12" width="132" height="104" fill="#f2f9f5" stroke="#d7ebe1"/>
  <rect x="110" y="182" width="16" height="24" rx="4" fill="#27a06a"/>
  <rect x="134" y="164" width="16" height="42" rx="4" fill="#1f8f5d"/>
  <rect x="158" y="148" width="16" height="58" rx="4" fill="#f2b53f"/>
  <rect x="182" y="156" width="16" height="50" rx="4" fill="#35b47a"/>
  <path d="M108 150 L132 140 L156 152 L180 128 L206 136" fill="none" stroke="#0f5a39" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="108" cy="150" r="4" fill="#0f5a39"/>
  <circle cx="132" cy="140" r="4" fill="#0f5a39"/>
  <circle cx="156" cy="152" r="4" fill="#0f5a39"/>
  <circle cx="180" cy="128" r="4" fill="#0f5a39"/>
  <circle cx="206" cy="136" r="4" fill="#0f5a39"/>

  <!-- info cards -->
  <rect x="244" y="118" rx="12" width="80" height="46" fill="#e3f5ea"/>
  <text x="284" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#56736a">MUESTRAS</text>
  <text x="284" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166a3f">128</text>

  <rect x="244" y="176" rx="12" width="80" height="46" fill="#fff6dd"/>
  <text x="284" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#56736a">A/G</text>
  <text x="284" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8a6200">1,39</text>

  <!-- floating check badge -->
  <g filter="url(#shadow)">
    <circle cx="322" cy="252" r="38" fill="#f2b53f"/>
    <path d="M304 252 L316 264 L342 238" fill="none" stroke="#0f5a39" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- base -->
  <ellipse cx="210" cy="312" rx="132" ry="18" fill="#0a3a25" fill-opacity="0.12"/>
</svg>
